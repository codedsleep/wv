[package]
name = "weave"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codedsleep/animated-term-tiling-rust"

[workspace]
members = ["."]

[[bin]]
name = "wv"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.28", features = ["event-stream", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt", "macros", "io-util", "time", "sync", "signal", "net", "process"] }
portable-pty = "0.8"
vt100 = "0.15"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-width = "0.2"
unicode-segmentation = "1"
async-trait = "0.1"
bitflags = "2"
bincode = { version = "2", features = ["serde"] }

[dev-dependencies]
criterion = "0.5"
insta = "1"
proptest = "1"

[[bench]]
name = "diff"
harness = false

[[bench]]
name = "compose"
harness = false

# Kept as a plain release-with-LTO profile for building distributable binaries
# by hand: `cargo build --profile dist`. It no longer drives any pipeline.
[profile.dist]
inherits = "release"
lto = "thin"
