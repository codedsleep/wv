[package]
name = "weave"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[[bin]]
name = "wv"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
tokio = { version = "1", features = ["rt", "macros", "io-util", "time", "sync", "signal"] }
portable-pty = "0.8"
vt100 = "0.15"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-width = "0.2"
unicode-segmentation = "1"
async-trait = "0.1"
bitflags = "2"

[dev-dependencies]
criterion = "0.5"
insta = "1"
