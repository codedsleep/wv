[package]
name = "weave"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codedsleep/animated-term-tiling-rust"

[workspace]
members = ["."]

[workspace.metadata.dist]
cargo-dist-version = "0.25.0"
ci = "github"
installers = []
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
hosting = "github"
unix-archive = ".tar.xz"

[[bin]]
name = "wv"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.28", features = ["event-stream", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt", "macros", "io-util", "time", "sync", "signal", "net", "process"] }
portable-pty = "0.8"
vt100 = "0.15"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-width = "0.2"
unicode-segmentation = "1"
async-trait = "0.1"
bitflags = "2"
bincode = { version = "2", features = ["serde"] }

[dev-dependencies]
criterion = "0.5"
insta = "1"
proptest = "1"

[[bench]]
name = "diff"
harness = false

[[bench]]
name = "compose"
harness = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
