name: Feature request
description: Propose a new feature or enhancement.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check the non-goals in the README. weave is intentionally small:
        no plugins, no floating windows, no GPU, no Windows/macOS in v1.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user-facing pain. Skip the proposed solution for a moment.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Sketch keybinds, config, or UI behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried, or other designs you weighed.

  - type: dropdown
    id: scope
    attributes:
      label: Where does this fit?
      multiple: true
      options:
        - Layout / tiling
        - Animation / motion
        - tmux backend
        - Native backend
        - Config / theming
        - Rendering / chrome
        - CLI / lifecycle
        - Other
    validations:
      required: true
